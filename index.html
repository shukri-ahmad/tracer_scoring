<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKEROBOT TRACER - Live Standings</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-gear: #e72429;
            --blue-gear: #1f4179;
            --tracer-grad: linear-gradient(90deg, #5c4300 0%, #e6a800 100%);
            --gold-accent: #e6a800;
            --bg-dark: #090c10;
            --panel-bg: #111822;
            --border-glow: #1f4179;
            --text-main: #c9d1d9;
            --neon-green: #00ff88;
            --cyan-glow: #00e5ff;
        }

        body { font-family: 'Rajdhani', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(230, 168, 0, 0.15) 0%, transparent 50%); }
        .container { max-width: 1050px; margin: 0 auto; background: var(--panel-bg); padding: 20px 30px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 1px solid var(--border-glow); margin-bottom: 30px; }
        
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; text-align: center; color: white; letter-spacing: 1px; text-transform: uppercase; margin-top: 0;}
        .logo-container { text-align: center; margin-bottom: 10px; }
        .logo-container img { max-width: 220px; filter: drop-shadow(0 0 10px rgba(230,168,0,0.3)); }
        
        .header-links { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-links a { color: var(--gold-accent); text-decoration: none; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 14px; text-transform: uppercase; transition: color 0.3s;}
        .header-links a:hover { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
        
        .audio-btn { background: #1f4179; color: white; border: 1px solid #79c0ff; padding: 5px 15px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .audio-btn:hover { background: var(--neon-green); color: black; border-color: var(--neon-green); }
        .audio-btn.active { background: rgba(39, 174, 96, 0.2); color: var(--neon-green); border-color: var(--neon-green); }

        .game-selector { text-align: center; margin-bottom: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid #30363d; }
        .game-selector select { padding: 10px; font-size: 16px; border-radius: 4px; font-weight: bold; width: 50%; background: #0d1117; color: white; border: 1px solid var(--border-glow); font-family: 'Rajdhani', sans-serif; }

        .public-timer-box { display: none; text-align: center; background: #0d1117; padding: 15px 20px; border: 2px solid var(--border-glow); border-radius: 8px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.5); transition: border-color 0.3s ease, background 0.3s ease; }
        .public-timer-title { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--gold-accent); letter-spacing: 2px; text-transform: uppercase; }
        .public-timer-display { font-size: 3em; font-family: 'Orbitron', monospace; font-weight: 900; margin: 5px 0 0 0; display: inline-flex; justify-content: center; align-items: center; white-space: nowrap; }
        .public-timer-display .digit-slot { display: inline-block; width: 0.75em; text-align: center; }

        .race-widget-border { border-color: var(--cyan-glow); box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); animation: pulseWidget 1.5s infinite alternate; }
        .race-widget-title { color: var(--cyan-glow); }
        .race-widget-timer { color: white; text-shadow: 0 0 15px var(--cyan-glow); }
        @keyframes pulseWidget { from { box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); } to { box-shadow: 0 0 25px rgba(0, 229, 255, 0.5); } }

        .public-timer-toast { font-size: 1.8em; font-family: 'Orbitron', sans-serif; font-weight: 900; color: #0d1117 !important; background: var(--neon-green); padding: 10px 15px; border-radius: 6px; box-shadow: 0 0 20px var(--neon-green); text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; display: inline-block; animation: pulseGlow 1s infinite alternate; }
        @keyframes pulseGlow { from { box-shadow: 0 0 10px var(--neon-green); } to { box-shadow: 0 0 25px var(--neon-green); } }

        .race-widget-toast { font-size: 1.8em; font-family: 'Orbitron', sans-serif; font-weight: 900; color: #0d1117 !important; background: var(--cyan-glow); padding: 10px 15px; border-radius: 6px; box-shadow: 0 0 20px var(--cyan-glow); text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; display: inline-block; animation: pulseCyan 1s infinite alternate; }
        @keyframes pulseCyan { from { box-shadow: 0 0 10px rgba(0, 229, 255, 0.5); } to { box-shadow: 0 0 25px rgba(0, 229, 255, 1); } }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 17px; }
        th, td { padding: 14px 10px; text-align: center; border-bottom: 1px solid #30363d; vertical-align: middle; transition: background 0.3s;}
        th { background: var(--tracer-grad); color: white; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px; }
        
        .rank-1 { background: rgba(230, 168, 0, 0.15) !important; }
        .rank-1 td { color: #fff; font-weight: bold; text-shadow: 0 0 5px var(--gold-accent); }
        
        .active-racer-row { background: rgba(0, 229, 255, 0.15) !important; border-left: 3px solid var(--cyan-glow); }
        .active-racer-row td { color: var(--cyan-glow); text-shadow: 0 0 8px rgba(0, 229, 255, 0.5); font-weight: bold; }
        .dq-row td { opacity: 0.6; }

        .team-name { font-weight: bold; text-align: left; padding-left: 15px; font-size: 1.1em; color: white;}
        .time-font { font-family: 'Orbitron', monospace; font-weight: 700; font-size: 1.1em; white-space: nowrap; }
        .total-time-box { font-size: 1.2em; font-weight: bold; background: #0d1117; border: 1px solid var(--neon-green); border-radius: 4px; display: inline-block; padding: 6px 12px; color: var(--neon-green); text-shadow: 0 0 8px rgba(0,255,136,0.4); white-space: nowrap;}
        .pending-box { font-size: 0.9em; color: #6e7681; font-style: italic; white-space: nowrap;}
        .dq-box { font-size: 1.1em; font-weight: bold; background: rgba(231, 36, 41, 0.1); border: 1px solid var(--red-gear); border-radius: 4px; display: inline-block; padding: 6px 12px; color: #ff7b72; white-space: nowrap;}
        
        .mod-chip { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-family: 'Orbitron', sans-serif; font-weight: bold; margin: 0;}
        .mod-green { background: rgba(39, 174, 96, 0.2); color: #2ecc71; border: 1px solid #27ae60;}
        .mod-red { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #c0392b;}
        .mod-round { background: rgba(157, 78, 221, 0.2); color: #c77dff; border: 1px solid #9d4edd; margin-left: 8px;}

        .formula-text { text-align: center; font-size: 13px; color: #8b949e; margin-top: -5px; margin-bottom: 20px; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <div class="header-links">
        <button id="audioToggleBtn" class="audio-btn" onclick="toggleAudio()">🔇 ENABLE AUDIO</button>
        <a href="admin.html">[ ADMIN TERMINAL ]</a>
    </div>
    
    <div class="logo-container">
        <img src="[FINAL] LOGO MAKEROBOT2026 (8)-Photoroom.png" alt="Makerobot Tracer Logo">
        <h2 style="margin-top: 5px; font-size: 26px; color: var(--gold-accent);">TRACER LIVE STANDINGS</h2>
    </div>
    
    <div class="game-selector">
        <label for="publicGameSelect" style="font-weight: bold; display: block; margin-bottom: 8px; color: #8b949e; font-family: 'Orbitron', sans-serif;">SELECT CATEGORY</label>
        <select id="publicGameSelect" onchange="loadSelectedGame()"><option>INITIALIZING...</option></select>
    </div>

    <div id="publicTimerBox" class="public-timer-box">
        <div id="publicTimerTitle" class="public-timer-title">GLOBAL CODING PHASE</div>
        <div id="publicTimerDisplay" class="public-timer-display" style="color: var(--neon-green); text-shadow: 0 0 15px rgba(0,255,136,0.5);">00:00.00</div>
    </div>

    <div id="raceTimerBox" class="public-timer-box race-widget-border">
        <div id="raceTimerTitle" class="public-timer-title race-widget-title">LIVE RUN: [TEAM]</div>
        <div id="raceTimerDisplay" class="public-timer-display race-widget-timer">00:00.00</div>
    </div>

    <p class="formula-text">TOTAL TIME = CODING TIME + RACE TIME - (POINTS x 10s) + (PENALTIES x 10s)</p>
    
    <table>
        <thead>
            <tr>
                <th style="width: 8%;">RANK</th>
                <th style="width: 25%; text-align: left; padding-left: 15px;">TEAM</th>
                <th style="width: 15%;">CODING TIME</th>
                <th style="width: 15%;">RACE TIME</th>
                <th style="width: 17%;">MODIFIERS</th>
                <th style="width: 20%;">FINAL TOTAL TIME</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr><td colspan="6" style="color: #8b949e;">AWAITING DATA...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCGERiYn2mKRHH4O3DSVunFeIQBYn4QjBM",
    authDomain: "makerobot-blitz.firebaseapp.com",
    projectId: "makerobot-blitz",
    storageBucket: "makerobot-blitz.firebasestorage.app",
    messagingSenderId: "343992286368",
    appId: "1:343992286368:web:e5f99c7df490c1d6369dc5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- DETERMINISTIC AUDIO ENGINE ---
  let isAudioEnabled = false;
  const sfxStart = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
  const sfxFinish = new Audio('https://actions.google.com/sounds/v1/ui/message_notification.ogg');
  const sfxTick = new Audio('https://actions.google.com/sounds/v1/alarms/mechanical_clock_tick.ogg');
  
  sfxTick.loop = true;
  sfxTick.volume = 0.2; // Keep ticking background subtle
  
  window.toggleAudio = function() {
      isAudioEnabled = !isAudioEnabled;
      const btn = document.getElementById("audioToggleBtn");
      if (isAudioEnabled) {
          btn.innerText = "🔊 AUDIO ACTIVE";
          btn.classList.add("active");
          // Unlock browser audio context securely
          sfxTick.play().then(() => sfxTick.pause()).catch(()=>{});
          sfxStart.play().then(() => sfxStart.pause()).catch(()=>{});
          sfxFinish.play().then(() => sfxFinish.pause()).catch(()=>{});
          evaluateTickSound(); // Resume ticking instantly if phase is currently running
      } else {
          btn.innerText = "🔇 ENABLE AUDIO";
          btn.classList.remove("active");
          sfxTick.pause();
      }
  };

  function playSound(type) {
      if (!isAudioEnabled) return;
      if (type === 'start') { sfxStart.currentTime = 0; sfxStart.play().catch(()=>{}); }
      if (type === 'finish') { sfxFinish.currentTime = 0; sfxFinish.play().catch(()=>{}); }
  }

  function evaluateTickSound() {
      if (!isAudioEnabled) return;
      const isGlobalRunning = currentGameData && currentGameData.codingStartTimestamp && !currentGameData.isCodingPaused && !currentGameData.isCodingLocked;
      const isRaceRunning = currentActiveRacer !== null;
      
      if (isGlobalRunning || isRaceRunning) {
          if (sfxTick.paused) sfxTick.play().catch(()=>{});
      } else {
          if (!sfxTick.paused) sfxTick.pause();
      }
  }
  // ----------------------------------

  let unsubGameDoc = null;
  let unsubTeams = null;
  let publicTimerInterval = null;
  let liveRaceInterval = null; 
  
  let currentGameData = null;
  let previousTeamsMap = {};
  
  let toastTimeout = null;
  let raceToastTimeout = null;
  let currentActiveRacer = null;
  let wasGlobalCodingRunning = false;

  function formatTimerWidget(ms) {
      if(ms === null || ms === undefined || ms < 0) return "--:--.--";
      let date = new Date(ms);
      let m = String(date.getUTCMinutes()).padStart(2, '0');
      let s = String(date.getUTCSeconds()).padStart(2, '0');
      let msStr = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');
      
      let raw = `${m}:${s}.${msStr}`;
      let html = '';
      for(let char of raw) { html += `<span class="digit-slot">${char}</span>`; }
      return html;
  }

  function formatTime(ms) {
      if(ms === null || ms === undefined || ms < 0) return "--:--.--";
      let date = new Date(ms);
      let m = String(date.getUTCMinutes()).padStart(2, '0');
      let s = String(date.getUTCSeconds()).padStart(2, '0');
      let msStr = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');
      return `${m}:${s}.${msStr}`;
  }

  function getGlobalElapsedCodingTime() {
      if (!currentGameData) return 0;
      let accum = currentGameData.codingAccumulatedMs || 0;
      if (currentGameData.codingStartTimestamp && !currentGameData.isCodingPaused) {
          accum += (Date.now() - currentGameData.codingStartTimestamp);
      }
      return accum;
  }

  async function loadGamesList() {
      const selectElement = document.getElementById("publicGameSelect");
      const gamesSnap = await getDocs(collection(db, "tracer_games"));
      selectElement.innerHTML = "";
      if(gamesSnap.empty) { selectElement.innerHTML = "<option>NO GAMES FOUND</option>"; return; }
      gamesSnap.forEach(docSnap => { selectElement.innerHTML += `<option value="${docSnap.id}">${docSnap.data().name}</option>`; });
      loadSelectedGame();
  }
  loadGamesList();

  window.loadSelectedGame = function() {
      const gameId = document.getElementById("publicGameSelect").value;
      if(!gameId || gameId === "NO GAMES FOUND") return;

      if(unsubGameDoc) unsubGameDoc();
      if(unsubTeams) unsubTeams();
      clearInterval(publicTimerInterval);
      clearInterval(liveRaceInterval);
      
      previousTeamsMap = {};
      wasGlobalCodingRunning = false;

      unsubGameDoc = onSnapshot(doc(db, "tracer_games", gameId), (docSnap) => {
          currentGameData = docSnap.data();
          
          // Sound Trigger: Global Coding Phase changes
          const isGlobalRunning = currentGameData && currentGameData.codingStartTimestamp && !currentGameData.isCodingPaused && !currentGameData.isCodingLocked;
          
          if (isGlobalRunning && !wasGlobalCodingRunning) {
              playSound('start'); // Global timer started or resumed
          } else if (!isGlobalRunning && wasGlobalCodingRunning) {
              if (currentGameData.isCodingLocked) playSound('finish'); // Global timer formally locked
          }
          wasGlobalCodingRunning = !!isGlobalRunning;
          
          evaluateTickSound(); // Update ticking state
          renderPublicTimer();
      });

      unsubTeams = onSnapshot(collection(db, "tracer_games", gameId, "teams"), (snapshot) => {
        let teams = [];
        let newlyFinishedCodingTeam = null;
        let newlyFinishedRaceTeam = null;
        let activeRacer = null;

        snapshot.forEach(docSnap => {
            let data = docSnap.data();
            let teamId = docSnap.id;
            
            if (previousTeamsMap[teamId] && previousTeamsMap[teamId].codingTimeMs === null && data.codingTimeMs !== null) {
                newlyFinishedCodingTeam = { name: data.name, timeMs: data.codingTimeMs };
            }

            if (previousTeamsMap[teamId] && previousTeamsMap[teamId].raceTimeMs === null && data.raceTimeMs !== null && !data.isDQ) {
                newlyFinishedRaceTeam = { name: data.name, timeMs: data.raceTimeMs };
            }

            if (data.raceStartTimestamp !== null && !data.isDQ) {
                activeRacer = { id: teamId, ...data };
            }
            
            previousTeamsMap[teamId] = data;
            teams.push({ id: teamId, ...data });
        });

        // Sound Trigger: Race Start Check
        const isRaceStarting = activeRacer && (!currentActiveRacer || currentActiveRacer.id !== activeRacer.id);
        currentActiveRacer = activeRacer;

        if (isRaceStarting) {
            playSound('start'); // A team started running their race
        }

        // Sound Trigger: Finishes
        if (newlyFinishedCodingTeam) {
            playSound('finish'); 
            triggerFinishToast(newlyFinishedCodingTeam.name, newlyFinishedCodingTeam.timeMs);
        }
        if (newlyFinishedRaceTeam) {
            playSound('finish');
            triggerRaceFinishToast(newlyFinishedRaceTeam.name, newlyFinishedRaceTeam.timeMs);
        }

        evaluateTickSound(); // Evaluate if ticking should continue
        renderLiveRaceWidget(activeRacer);
        
        teams.sort((a, b) => {
            if (a.isDQ && !b.isDQ) return 1;
            if (!a.isDQ && b.isDQ) return -1;

            let attemptA = a.attempt || 1;
            let attemptB = b.attempt || 1;
            if (attemptA !== attemptB) return attemptA - attemptB;

            if (a.totalTimeMs !== null && b.totalTimeMs !== null) return a.totalTimeMs - b.totalTimeMs;
            if (a.totalTimeMs !== null) return -1;
            if (b.totalTimeMs !== null) return 1;

            if (a.codingTimeMs !== null && b.codingTimeMs !== null) return a.codingTimeMs - b.codingTimeMs;
            if (a.codingTimeMs !== null) return -1;
            if (b.codingTimeMs !== null) return 1;

            return a.name.localeCompare(b.name);
        });
        
        renderLeaderboardTable(teams, activeRacer ? activeRacer.id : null);
      });
  };

  function renderLiveRaceWidget(activeRacer) {
      if (!activeRacer) clearInterval(liveRaceInterval);
      if (raceToastTimeout && !activeRacer) return; 
      if (raceToastTimeout && activeRacer) { clearTimeout(raceToastTimeout); raceToastTimeout = null; }

      const raceBox = document.getElementById("raceTimerBox");
      const raceTitle = document.getElementById("raceTimerTitle");
      const raceUI = document.getElementById("raceTimerDisplay");

      if (activeRacer) {
          raceBox.style.display = "block";
          raceTitle.innerText = `🟢 LIVE ON TRACK: ${activeRacer.name}`;
          raceUI.className = "public-timer-display race-widget-timer"; 
          
          clearInterval(liveRaceInterval);
          liveRaceInterval = setInterval(() => {
              const elapsed = Date.now() - activeRacer.raceStartTimestamp;
              raceUI.innerHTML = formatTimerWidget(elapsed);
          }, 50);

          document.getElementById("publicTimerBox").style.display = "none";
      } else {
          clearInterval(liveRaceInterval);
          raceBox.style.display = "none";
          renderPublicTimer();
      }
  }

  function triggerRaceFinishToast(teamName, timeMs) {
      if (currentActiveRacer) return;
      
      const raceBox = document.getElementById("raceTimerBox");
      const raceTitle = document.getElementById("raceTimerTitle");
      const raceUI = document.getElementById("raceTimerDisplay");

      raceBox.style.display = "block";
      raceTitle.innerText = "🏁 RACE COMPLETED!";
      raceUI.className = "race-widget-toast";
      raceUI.innerText = `${teamName} : ${formatTime(timeMs)}`;

      document.getElementById("publicTimerBox").style.display = "none";

      if (raceToastTimeout) clearTimeout(raceToastTimeout);
      raceToastTimeout = setTimeout(() => {
          raceToastTimeout = null;
          raceUI.className = "public-timer-display race-widget-timer";
          renderLiveRaceWidget(currentActiveRacer); 
      }, 4000);
  }

  function renderPublicTimer() {
      if (toastTimeout) return; 
      if (raceToastTimeout || currentActiveRacer) return; 

      const box = document.getElementById("publicTimerBox");
      const title = document.getElementById("publicTimerTitle");
      const ui = document.getElementById("publicTimerDisplay");

      if (!currentGameData || currentGameData.isCodingLocked) {
          clearInterval(publicTimerInterval);
          box.style.display = "none";
          return;
      }

      const isStarted = currentGameData.codingStartTimestamp || currentGameData.codingAccumulatedMs > 0;

      if (isStarted) {
          box.style.display = "block";
          const isRunning = currentGameData.codingStartTimestamp && !currentGameData.isCodingPaused;

          if (isRunning) {
              title.innerText = "GLOBAL CODING PHASE - IN PROGRESS";
              ui.className = "public-timer-display";
              ui.style.color = "var(--neon-green)";
              ui.style.textShadow = "0 0 15px rgba(0,255,136,0.5)";
              
              clearInterval(publicTimerInterval);
              publicTimerInterval = setInterval(() => {
                  if (!toastTimeout) ui.innerHTML = formatTimerWidget(getGlobalElapsedCodingTime());
              }, 50);
          } else {
              clearInterval(publicTimerInterval);
              title.innerText = "GLOBAL CODING PHASE - PAUSED";
              ui.className = "public-timer-display";
              ui.style.color = "var(--gold-accent)";
              ui.style.textShadow = "0 0 10px rgba(230,168,0,0.5)";
              ui.innerHTML = formatTimerWidget(getGlobalElapsedCodingTime());
          }
      } else {
          clearInterval(publicTimerInterval);
          box.style.display = "none";
      }
  }

  function triggerFinishToast(teamName, timeMs) {
      if (currentActiveRacer || raceToastTimeout) return;

      const box = document.getElementById("publicTimerBox");
      const title = document.getElementById("publicTimerTitle");
      const ui = document.getElementById("publicTimerDisplay");

      box.style.display = "block";
      
      title.innerText = "⚡ TEAM CODING COMPLETED!";
      ui.className = "public-timer-toast";
      ui.innerText = `${teamName} : ${formatTime(timeMs)}`;

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
          toastTimeout = null;
          ui.className = "public-timer-display";
          renderPublicTimer();
      }, 4000);
  }

  function renderLeaderboardTable(teams, activeRacerId) {
      const tbody = document.getElementById("leaderboard-body");
      let htmlBuffer = ""; 
      
      if (teams.length === 0) {
          tbody.innerHTML = "<tr><td colspan='6' style='color: #8b949e;'>NO TEAMS REGISTERED IN THIS CATEGORY.</td></tr>";
          return;
      }

      teams.forEach((team, index) => {
        let codeStr = formatTime(team.codingTimeMs);
        let raceStr = formatTime(team.raceTimeMs);
        let modHtml = "";
        let totalHtml = "";

        if (team.isDQ) {
            codeStr = `<span style="opacity:0.5">${codeStr}</span>`;
            raceStr = "--:--.--";
            modHtml = `<span style="color:#6e7681">-</span>`;
            totalHtml = `<span class="dq-box">NOT COMPLETE</span>`;
        } else {
            if(team.points > 0) modHtml += `<span class="mod-chip mod-green">-${team.points * 10}s</span>`;
            if(team.penalties > 0) modHtml += `<span class="mod-chip mod-red">+${team.penalties * 10}s</span>`;
            if(!modHtml) modHtml = `<span style="color:#6e7681">-</span>`;

            totalHtml = team.totalTimeMs !== null 
                ? `<span class="total-time-box time-font">${formatTime(team.totalTimeMs)}</span>` 
                : `<span class="pending-box">IN PROGRESS</span>`;
        }

        let codeColor = team.codingTimeMs !== null ? 'var(--gold-accent)' : '#8b949e';
        let raceColor = team.raceTimeMs !== null ? 'var(--gold-accent)' : '#8b949e';
        
        let rowClass = "";
        if (team.isDQ) rowClass = "dq-row";
        else if (team.id === activeRacerId) rowClass = "active-racer-row";
        else if (index === 0 && (team.totalTimeMs !== null || team.codingTimeMs !== null)) rowClass = "rank-1";

        let nameHtml = team.name;
        if ((team.attempt || 1) > 1) nameHtml += ` <span class="mod-chip mod-round">R${team.attempt}</span>`;

        htmlBuffer += `
          <tr class="${rowClass}">
            <td class="time-font" style="color: white;">${index + 1}</td>
            <td class="team-name">${nameHtml}</td>
            <td class="time-font" style="color: ${codeColor}">${codeStr}</td>
            <td class="time-font" style="color: ${raceColor}">${raceStr}</td>
            <td><div style="display: flex; justify-content: center; align-items: center; gap: 4px;">${modHtml}</div></td>
            <td>${totalHtml}</td>
          </tr>`;
      });
      
      tbody.innerHTML = htmlBuffer;
  }
</script>

</body>
</html>
